services:
  - type: web
    name: aigc-platform-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: AIGC_PROVIDER
        value: mock
      - key: BLOCKCHAIN_PROVIDER
        value: mock
      - key: JWT_SECRET
        value: aigc-platform-secret-2024
